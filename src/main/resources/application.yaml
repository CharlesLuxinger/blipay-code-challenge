openweather:
  api:
    base-url: https://api.openweathermap.org/data/2.5
    key: ${OPENWEATHER_API_KEY:}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

spring:
  application:
    name: blipay-credit-scoring
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/credit_scoring}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
